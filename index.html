<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppleLauncher</title>
  <link rel="stylesheet" href="assets/styles/app.css">
</head>
<body>
  <div id="splash" class="splash" aria-busy="true">
    <img class="splash-logo" src="assets/icon.png" alt="AppleLauncher">
    <div class="splash-text">Загрузка</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>

  <div class="cover-bg" id="bgLayer"></div>
  <div class="cover-tint"></div>

  <div class="cover-shell">
    <header class="cover-titlebar" aria-label="Управление окном">
      <div class="cover-controls">
        <button class="control-btn minimize-btn" id="minimizeBtn" title="Свернуть" aria-label="Свернуть"></button>
        <button class="control-btn close-btn" id="closeBtn" title="Закрыть" aria-label="Закрыть"></button>
      </div>
    </header>

    <img class="brand-logo" id="brandLogo" alt="Логотип bodaYan">

    <main class="cover-main">
      <section class="card login-card" aria-label="Форма входа">
        <div class="input-group">
          <label for="username">Никнейм</label>
          <input type="text" id="username" name="minecraftNickname" placeholder="Введите никнейм" maxlength="16" autocomplete="off">
          <div class="input-error" id="usernameError" role="alert" hidden></div>
        </div>

        <div class="cover-online" id="onlineStatus">Онлайн: 4/100</div>

        <button class="play-btn" id="playBtn">Играть</button>

        <div class="account-slot" id="accountSlot">
          <button class="cover-account" id="accountBtn" type="button">Создать аккаунт</button>
          <div class="progress-wrap" id="progressWrap" hidden>
            <div class="progress" id="progressTrack"><div class="progress-bar" id="progressBar"></div></div>
            <div class="progress-label" id="progressLabel"></div>
          </div>
        </div>
        <div class="status-bar info" id="statusText" role="status" aria-live="polite">Готов к запуску</div>
      </section>
    </main>
  </div>

  <button class="cover-report" id="reportBtn" type="button">Сообщить об ошибке</button>

  <script src="src/nicknameValidation.js"></script>
  <script src="src/renderer.js"></script>
</body>
</html>
